# Online match rooms. Not deployed yet: run it on this PC with `npx wrangler@4 dev` (see README.md).
name = "siege-zeke-online"
main = "src/index.js"
compatibility_date = "2026-10-01"
workers_dev = false

# One Durable Object per room; its SQLite storage keeps the match.
[[durable_objects.bindings]]
name = "ROOM"
class_name = "Room"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["Room"]

# The match-log Worker's KV: a finished online match is written there as one log.
# Nothing reads or writes it until this Worker is deployed.
[[kv_namespaces]]
binding = "MATCH_LOGS"
id = "5f07a61c1c394d94806955c10dbf6bc6"

# Room codes are checked against a secret ROOM_CODE_KEY (a Worker secret; a test value in .dev.vars on this PC only).

# The game connects here; the domain is already on this Cloudflare account.
[[routes]]
pattern = "play.siegezeke.online"
custom_domain = true
