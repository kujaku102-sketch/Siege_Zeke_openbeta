# Online match rooms (Worker + Room Durable Object) for play.siegezeke.online.
# Run it on this PC with `npx wrangler@4 dev`; putting it on Cloudflare (login, secrets, deploy) is done by 文豪, see README.md.
name = "siege-zeke-online"
main = "src/index.js"
compatibility_date = "2026-10-01"
workers_dev = false

# One Durable Object per room; its SQLite storage keeps the match.
[[durable_objects.bindings]]
name = "ROOM"
class_name = "Room"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["Room"]

# The match-log Worker's KV: a finished online match is written there as one log.
[[kv_namespaces]]
binding = "MATCH_LOGS"
id = "5f07a61c1c394d94806955c10dbf6bc6"

# Secrets (set with `wrangler secret put`, never written here; a test value in .dev.vars on this PC only):
#   ROOM_CODE_KEY (room codes), AUTH_KEY (Discord state and tickets), DISCORD_CLIENT_SECRET.
# Variables (public values):
#   DISCORD_REDIRECT_URI: the page Discord sends the player back to; it must equal the Redirect registered in the Discord app.
#     It points at the staging page for the first real test. When the game moves to siegezeke.online, change it to
#     "https://siegezeke.online/discord-callback.html", register that Redirect in the Discord app too, and deploy again.
#   DISCORD_CLIENT_ID: the Discord app's Client ID (digits). Added here when 文豪 has made the app; until then
#     /auth/discord/* answers SERVER_MISCONFIGURED and guests play as before.
[vars]
DISCORD_REDIRECT_URI = "https://staging.siege-zeke-simple-public.pages.dev/discord-callback.html"

# The game connects here; the domain is already on this Cloudflare account.
[[routes]]
pattern = "play.siegezeke.online"
custom_domain = true
